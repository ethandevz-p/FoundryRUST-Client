[workspace]
exclude = ["crates/foundry-telemetry-server", "launcher", "crates/foundry-mod-registry", "third_party/wgpu-hal", "third_party/naga", "third_party/libmimalloc-sys", "tools/fixtures/paper-trace-mod"]
members = [
    "crates/foundry-guest-stack",
    "crates/foundry-mod-vocab",
    "crates/foundry-game-discovery",
    "crates/foundry-cosmetics",
    "crates/foundry-telemetry",
    "crates/foundry-hooks",
    "crates/foundry-mod-host",
    "crates/foundry-game",
    "crates/foundry-official",
    "crates/foundry-heartbeat",

    "crates/foundry-core",
    "crates/foundry-platform",
    "crates/foundry-addresses",
    "crates/foundry-mod-runtime",
    "crates/foundry-mod-render",
    "docs/modding/examples",
    "crates/foundry-dualsense",
    "crates/foundry-narrator",
    "crates/foundry-threads",
    "crates/foundry-hdr",
    "crates/foundry-world",
    "crates/foundry-client",
    "crates/foundry-engine-slots",
    "crates/foundry-mod-points",
    "crates/foundry-internals",
    "crates/foundry-client-lib",
    "crates/foundry-gameplay",
    "crates/foundry-client-gameplay",
    "crates/foundry-client-core",
    "crates/foundry-client-input",
    "crates/foundry-client-render",
    "crates/foundry-command",
    "crates/foundry-items",
    "crates/foundry-server-files",
    "crates/foundry-java-properties",
    "crates/foundry-anticheat",
    "crates/foundry-chat-filter",
    # The Model Context Protocol, shared by foundry-ctl, foundry-server and the launcher.
    "crates/foundry-mcp",
    "crates/foundry-server",
    "crates/foundry-server-launch",
    "crates/foundry-bots",
    "crates/foundry-assets",
    "crates/foundry-protocol",
    "crates/foundry-theme",
    "crates/foundry-prepare",
    "crates/foundry-system",
    "crates/foundry-bench",
    "crates/foundry-perf-format",
    "crates/foundry-perf",
    "crates/foundry-perf-share",
    "crates/foundry-friends",
    "crates/foundry-relay",
    "crates/foundry-mod-package",
    "crates/foundry-mod-wasm",
    "crates/foundry-mod-api-gen",
    "crates/foundry-mod-api",
    "crates/foundry-mod-dimension-game",
    "crates/foundry-hot-paths-game",
    "crates/foundry-mod-api-macros",
    "crates/foundry-mod-source",
    "crates/foundry-mod-surface",
    "crates/foundry-mod-api-gen/dispatch-tests",
    "crates/foundry-mod-wasm/wire-loopback",
    "crates/cargo-foundry-mod",
    "crates/foundry-port-pack",
    "crates/foundry-port-pack-cli",
    "crates/foundry-shaders",
    "crates/foundry-optifine",
    "crates/foundry-polytone",
    "crates/foundry-shader-api",
    "crates/foundry-release-sign",
    "crates/foundry-mod-deps",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "LGPL-3.0-or-later"
rust-version = "1.95"

# Ports mirror vanilla's Java signatures, index loops and nested generic types
# one to one so they can be checked against the decompiled sources.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

# wgpu-hal 30.0.1 with gfx-rs/wgpu#10124: wgpu 30 creates a Vulkan descriptor
# pool with no pool sizes while it creates the device, which Vulkan allows only
# since 1.3.215, and Intel's Windows driver for 6th-10th gen iGPUs (HD 520/530,
# UHD 620/630) crashes on it with an access violation (#746). It also fixes the
# Metal backend's lookup of the CoreGraphics HDR colour space names, which handed
# CoreGraphics a symbol's address as the string and crashed HDR output on macOS.
# And gfx-rs/wgpu#10714: on Windows, Vulkan waits for the acquire fence only in
# FIFO (VSync), where it was meant to pace frames; with VSync off it made every
# frame wait for the GPU to finish the one before (#4604).
# Foundry Client's own change: on NVIDIA with a Wayland surface it waits for swapchain
# images on the CPU (swapchain/native.rs, `acquire_on_cpu`): a frame that waited for
# one on the GPU while the compositor held it (screen capture running, KDE Wayland)
# hung the GPU until the kernel's Xid 109 timeout lost the device.
# Drop this and the folder once a wgpu release has these fixes.
[patch.crates-io]
wgpu-hal = { path = "third_party/wgpu-hal" }
# naga 30.0.1, with the fixes to its GLSL frontend that shader packs need (THIRD_PARTY_NOTICES.md).
naga = { path = "third_party/naga" }
# libmimalloc-sys 0.1.49 whose mimalloc v3 counts bits without POPCNT when MSVC builds it: the
# game died before main on CPUs without it (Core 2, #7264; THIRD_PARTY_NOTICES.md). Drop this and
# the folder once a libmimalloc-sys release has microsoft/mimalloc#1291's fix.
libmimalloc-sys = { path = "third_party/libmimalloc-sys" }

# Line tables keep file:line in backtraces; full debug info made every
# example and test binary hundreds of megabytes and slow to link.
[profile.dev]
debug = "line-tables-only"

# The 512 MiB jar-boundary test still hashes every byte; run the hash kernel optimized.
# Likewise, the API generator repeatedly parses the game's sources with syn.
# These dependencies stay cached in CI, unlike workspace test binaries.
[profile.dev.package.sha2]
opt-level = 3

# Fixture tests compile real wasm modules with Cranelift at runtime. Keep the
# compiler optimized without optimizing (or weakening) the tests themselves.
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3

# Packaging validates each real module repeatedly. Optimize the validator, not
# the fixture or guest code (which use their separate foundry-wasm profile).
[profile.dev.package.foundry-mod-package]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3

[profile.dev.package.foundry-mod-api-gen]
opt-level = 3
[profile.dev.package.syn]
opt-level = 3
# The perf-format tests gzip over 512 MiB; unoptimized deflate took most of their time.
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.proc-macro2]
opt-level = 3
[profile.release.package.foundry-mod-api-gen]
opt-level = 3
[profile.release.package.syn]
opt-level = 3
[profile.release.package.proc-macro2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized but quick-to-link builds for iteration: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
