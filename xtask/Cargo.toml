[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Repository tasks: cargo run -p xtask -- package BINARY OUTDIR | tokens | mixins-tool"

[dependencies]
foundry-mod-api-gen = { path = "../crates/foundry-mod-api-gen" }
# `mixins-tool`: the pin, the carried patch and its applier, shared with the launcher.
foundry-addresses = { path = "../crates/foundry-addresses" }
foundry-mod-package = { path = "../crates/foundry-mod-package", default-features = false }
foundry-theme = { path = "../crates/foundry-theme" }

[lints]
workspace = true
