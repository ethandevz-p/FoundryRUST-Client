[package]
name = "mod-{id}"
version = "0.1.0"
edition = "2024"

[dependencies]
# The pinned SDK's API crate, fetched into .foundry/sdk/ by any `cargo foundry-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `foundry-launcher native-lock .` before building.
foundry-mod-api = { path = ".foundry/sdk/api/crates/foundry-mod-api" }
{metadata}