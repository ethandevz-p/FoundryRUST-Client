[package]
name = "foundry-client-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The client's world data, rendering and screens: chunks, meshing, light, streaming, the renderer, the HUD, menus and settings; no gameplay"

[dependencies]
foundry-guest-stack = { path = "../foundry-guest-stack" }
# The settings stores of the crates above the engine (docs/layers.md, "Platform registries").
foundry-hooks = { path = "../foundry-hooks" }
foundry-mod-runtime = { path = "../foundry-mod-runtime" }
mod_api = { package = "foundry-mod-vocab", path = "../foundry-mod-vocab" }
foundry-mod-api-macros = { path = "../foundry-mod-api-macros" }
foundry-engine-slots = { path = "../foundry-engine-slots" }
# The GUI atlas's pixels, kept compressed once uploaded (hud.rs `pack_pixels`).
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
foundry-assets = { path = "../foundry-assets" }
foundry-client-core = { path = "../foundry-client-core" }
foundry-client-input = { path = "../foundry-client-input" }
foundry-command = { path = "../foundry-command" }
foundry-core = { path = "../foundry-core" }
foundry-hdr = { path = "../foundry-hdr" }
foundry-items = { path = "../foundry-items" }
foundry-mod-package = { path = "../foundry-mod-package" }
# The narrator option's status and whether the narrator is there (Options.narrator).
foundry-narrator = { path = "../foundry-narrator" }
# OptiFine-format pack files: random entity textures (hud.rs), connected textures
# (connected.rs) and custom item texture rules (cit.rs).
foundry-optifine = { path = "../foundry-optifine" }
foundry-perf-format = { path = "../foundry-perf-format" }
foundry-polytone = { path = "../foundry-polytone" }
foundry-protocol = { path = "../foundry-protocol" }
foundry-shader-api = { path = "../foundry-shader-api" }
foundry-shaders = { path = "../foundry-shaders" }
foundry-system = { path = "../foundry-system" }
foundry-threads = { path = "../foundry-threads" }
foundry-world = { path = "../foundry-world" }
ab_glyph = "0.2.32"
base64 = "0.22"
bytemuck = { version = "1.24", features = ["derive"] }
# Sound (ALSA on Linux); the `audio` feature.
cpal = { version = "0.16", optional = true }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
glam = "0.30"
log = "0.4"
miniz_oxide = "0.8"
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-in", "hlsl-out"] }
half = "2"
png = "0.18"
# Project icons served by Modrinth are often WebP or JPEG rather than PNG, and
# the pack browser showed nothing for those. Both are small pure-Rust decoders.
image-webp = { version = "0.2", default-features = false }
zune-jpeg = { version = "0.4", default-features = false, features = ["std"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha1 = "0.10"
sha2 = "0.10.9"
smallvec = { version = "1", features = ["const_new"] }
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }
unicode-bidi = "0.3.18"
ureq = { version = "2", default-features = false, features = ["tls"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "naga-ir"] }
winit = "0.30.13"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["gles"] }

[features]
# Sound output: foundry-client's `audio` feature.
audio = ["dep:cpal"]
# Helpers foundry-client's tests build their fixtures with.
test-support = []
# The `scene_replay` example's allocator counts allocations (foundry-threads' `alloc-count`).
alloc-count = ["foundry-threads/alloc-count"]

[lints]
workspace = true

# Each installs the process-wide render slots and must run in its own process.
[[test]]
name = "render_slots"
path = "tests/render_slots.rs"

[[test]]
name = "world_view_slots"
path = "tests/world_view_slots.rs"

[[test]]
name = "standard_pack_gpu_entities"
path = "tests/standard_pack_gpu_entities.rs"

[[example]]
name = "standard_pack_gpu_entities"
path = "examples/standard_pack_gpu_entities.rs"

[dev-dependencies]
tempfile = "3"
mod_platform = { package = "foundry-mod-api", path = "../foundry-mod-api", features = ["testing"] }
foundry-perf = { path = "../foundry-perf" }
# Tests: a TrueType font to load, and the design system the menus' motion curves match.
foundry-theme = { path = "../foundry-theme" }
foundry-items = { path = "../foundry-items", features = ["test-support"] }
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out", "glsl-out", "msl-out", "spv-out"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Independently calibrate CPU timer delivery for live sampling assertions.
foundry-threads = { path = "../foundry-threads", features = ["sampling-test-support"] }
