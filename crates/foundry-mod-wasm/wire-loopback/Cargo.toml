[package]
name = "foundry-mod-wasm-wire-loopback"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Loopback tests of the generated wire proxies and service, without wasm; one module per tests/wire_loopback/ file"

[build-dependencies]
foundry-game-discovery = { path = "../../foundry-game-discovery" }
foundry-mod-api-gen = { path = "../../foundry-mod-api-gen" }

[dev-dependencies]
foundry-core = { path = "../../foundry-core" }
foundry-mod-runtime = { path = "../../foundry-mod-runtime" }
foundry-world = { path = "../../foundry-world" }
mod_api = { package = "foundry-mod-api", path = "../../foundry-mod-api", features = ["wasm-guest", "testing"] }
log = "0.4"
serde_json = "1"

[lints]
workspace = true
