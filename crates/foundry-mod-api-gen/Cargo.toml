[package]
name = "foundry-mod-api-gen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Build-time typed native mod API generation"

[features]
# Isolated generated native/guest boundary fixture; never enabled by game builds.
mixed-output-fixture = []

[dependencies]
foundry-game-discovery = { path = "../foundry-game-discovery" }
foundry-mod-surface = { path = "../foundry-mod-surface" }
foundry-mod-source = { path = "../foundry-mod-source" }
heck = "0.5"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
prettyplease = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1"
wit-parser = "0.261"

[[bin]]
name = "foundry-stage"
path = "src/bin/foundry-stage.rs"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
