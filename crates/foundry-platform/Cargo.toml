[package]
name = "foundry-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The platform's public API: what the Foundry Client layer and mods may use of the engine (docs/layers.md#platform)"

[features]
# Each part of the engine a Foundry Client crate may reach, so a crate builds only the engine it uses.
# level.dat, servers.dat and region files: NBT, compression, region read and write.
world = ["dep:foundry-world"]
# A server's address after its SRV record, the offline-mode UUID of a name, and servers.dat.
protocol = ["world", "dep:foundry-protocol"]
# Preparing the game's files from the player's own Minecraft install.
prepare = ["dep:foundry-prepare"]
# A server's own files: server.properties, the op, white and ban lists, the user cache.
server-files = ["dep:foundry-server-files", "dep:foundry-java-properties"]

mod-build = ["dep:foundry-mod-api-gen"]

# Mod files exposed to the launcher and registry without exposing engine dependencies.
mod-package = ["dep:foundry-mod-package"]
mod-index = ["mod-package", "foundry-mod-package/index"]
mod-prebuilt = ["mod-package", "foundry-mod-package/prebuilt"]
mod-runtime-process = ["mod-package", "foundry-mod-package/runtime-process"]

[dependencies]
foundry-guest-stack = { path = "../foundry-guest-stack" }
foundry-mod-api-gen = { path = "../foundry-mod-api-gen", optional = true }
foundry-mod-package = { path = "../foundry-mod-package", default-features = false, optional = true }
foundry-core = { path = "../foundry-core" }
foundry-system = { path = "../foundry-system" }
foundry-bench = { path = "../foundry-bench" }
foundry-perf-format = { path = "../foundry-perf-format" }
foundry-world = { path = "../foundry-world", optional = true }
foundry-protocol = { path = "../foundry-protocol", optional = true }
foundry-prepare = { path = "../foundry-prepare", optional = true }
foundry-server-files = { path = "../foundry-server-files", optional = true }
foundry-java-properties = { path = "../foundry-java-properties", optional = true }
# The game's extension points, re-exported as `hooks`.
foundry-hooks = { path = "../foundry-hooks" }

[lints]
workspace = true
