[package]
name = "foundry-client-lib"
autobins = false
autoexamples = false
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Reusable client systems, control tool and parity probes"

[build-dependencies]
foundry-game-discovery = { path = "../foundry-game-discovery" }

[lib]
path = "../foundry-client/src/client_lib.rs"

[dependencies]
foundry-guest-stack = { path = "../foundry-guest-stack" }
foundry-mod-api-macros = { path = "../foundry-mod-api-macros" }
foundry-engine-slots = { path = "../foundry-engine-slots" }
foundry-hooks = { path = "../foundry-hooks" }
foundry-mod-runtime = { path = "../foundry-mod-runtime" }
mod_api = { package = "foundry-mod-vocab", path = "../foundry-mod-vocab" }
# Whether a held lock file is still the one at its name (dev and inode, or volume and index).
same-file = "1"
foundry-assets = { path = "../foundry-assets" }
foundry-client-core = { path = "../foundry-client-core" }
foundry-client-input = { path = "../foundry-client-input" }
foundry-client-render = { path = "../foundry-client-render" }
foundry-command = { path = "../foundry-command" }
foundry-items = { path = "../foundry-items" }
foundry-core = { path = "../foundry-core" }
# `foundry-ctl mcp`: the Model Context Protocol, shared with the launcher and the server.
foundry-mcp = { path = "../foundry-mcp" }
# The server thread ahead of the workers (MinecraftServer.spin's Thread.setPriority).
foundry-optifine = { path = "../foundry-optifine" }
foundry-threads = { path = "../foundry-threads" }
# The .hzperf capture format and writer (docs/perf-platform.md).
foundry-perf-format = { path = "../foundry-perf-format" }
# One pool of helper threads for the server tick's parallel phases (`parallel.rs`): threads made
# once, not for every phase of every tick.
rayon = "1.10"
foundry-hdr = { path = "../foundry-hdr" }
foundry-world = { path = "../foundry-world" }
foundry-protocol = { path = "../foundry-protocol" }
# server.properties, eula.txt and the user lists, shared with foundry-server.
foundry-server-files = { path = "../foundry-server-files" }
# The JDK's clock, for the LAN host's random seed (lan/mod.rs).
foundry-java-properties = { path = "../foundry-java-properties" }
# The control endpoint's token (control.rs), as foundry-server's and the relay's.
getrandom = "0.3"
# The dedicated server's anticheat, off unless server.toml's [anticheat] turns it on (docs/anticheat.md).
foundry-anticheat = { path = "../foundry-anticheat" }
# Shader packs: reading them and turning their GLSL into naga modules.
foundry-shaders = { path = "../foundry-shaders" }
# Foundry Client's own shader packs: the format, the stages and the check (docs/shaders.md).
foundry-shader-api = { path = "../foundry-shader-api" }
# The narrator (GameNarrator): text-to-speech of chat, system messages and screens.
foundry-narrator = { path = "../foundry-narrator" }
# Foundry Client mods: sandboxed WebAssembly components, off unless installed and turned on (docs/modding/src/how-to/content-mods.md).
# Their runtime is the `mods` feature.
foundry-mod-package = { path = "../foundry-mod-package", default-features = false, features = ["index", "junction"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "naga-ir"] }
winit = "0.30.13"
pollster = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"
png = "0.18"
cap-std = "3"
cap-fs-ext = "3"
smallvec = "1"
shlex = "2"
sha2 = "0.10.9"
# Server resource packs are checked and cached by their SHA-1, as vanilla does.
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# hlsl-out: the gfx.rs tests translate every shader as wgpu's DirectX 12 backend does. A normal feature,
# not a dev-dependency's, so builds, tests and examples share one build of naga, wgpu and this crate.
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out"] }
miniz_oxide = "0.8"
ab_glyph = "0.2.32"
log = "0.4"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
# The network threads of a server's players: epoll, kqueue or Windows' AFD (lan/io_pool.rs).
mio = { version = "1.2.4", features = ["os-poll", "net"] }
# Shared chunk frames are found by one keyed 128-bit hash of their body (lan/conn.rs SharedFrames).
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
# Opt-in data collection: the game keeps, the launcher sends (docs/telemetry.md).
foundry-telemetry = { path = "../foundry-telemetry", default-features = false }
foundry-bench = { path = "../foundry-bench" }
crc32fast = "1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# Controllers (evdev + libudev on Linux, IOKit on macOS, Windows.Gaming.Input); the `controllers` feature.
gilrs = { version = "0.11", optional = true }
# HTTPS to the Minecraft services (online-mode session join).
ureq = { version = "2", default-features = false, features = ["tls"] }
unicode-bidi = "0.3.18"
# `LevelStorageAccess.estimateDiskSpace`: usable disk space, without unsafe code on Windows.
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }

[target.'cfg(unix)'.dependencies]
# The server thread's CPU time per tick (`FOUNDRY_SPIKES`, spans.rs).
rustix = { version = "1", default-features = false, features = ["std", "time", "process", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
# Use the registered URI handler without routing links through Explorer/cmd.
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
# Resolve virtualized folders to shell-compatible physical paths (desktop.rs).
dunce = "1.0.5"
# DirectX 12, where Vulkan has no adapter or device, or by choice (`graphicsApi`, graphics.rs).
# Shaders compile with FXC (d3dcompiler_47.dll, part of Windows), or on integrated GPUs with DXC
# (dxcompiler.dll beside the game, gfx/dx12_compiler.rs).
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Splitscreen: a window filling a monitor goes over its menu bar (game/runtime/split/windows.rs
# `above_menu_bar`); all already in the tree through winit and wgpu.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# OpenGL (WGL on Windows, EGL on Linux), the last fallback, for GPUs with no Vulkan or
# DirectX 12 driver (`graphicsApi`, graphics.rs).
wgpu = { version = "30.0.1", default-features = false, features = ["gles"] }

[features]
# Scoped observations for compiled-guest executor tests only.
test-payload-probe = []
# Isolated server-publication slots for resource-backed game fixtures only.
test-publication-scope = []
# Non-consuming residency journal observation for game fixtures only.
test-residency-observer = []
default = ["audio", "controllers"]
# Dev-only: the ignored tracker-send benchmark uses the executable's allocator.
tracker-send-bench = []
# Sound output. Without it (and `controllers`) the program links neither libasound nor libudev on
# Linux: the server build (`--no-default-features`, released as foundry-engine; docs/server.md).
audio = ["foundry-client-render/audio"]
# Controllers: gilrs, and the DualSense's own output. Without it only `foundry-ctl pad`'s virtual pad.
controllers = ["dep:gilrs", "foundry-client-input/controllers"]
# Records the call sites of mob random draws (`mob_ai_probe` traces).
rng-trace = ["foundry-core/rng-trace"]
# Compatibility with earlier experiment commands: main already uses mimalloc.
windows-mimalloc = []
# Opt-in Windows heap experiment; see docs/windows-allocators.md.
windows-segment-heap = []

[lints]
workspace = true

[dev-dependencies]
foundry-threads = { path = "../foundry-threads", features = ["test-allocation-probe"] }
foundry-mod-wasm = { path = "../foundry-mod-wasm", features = ["listener-fixture", "test-copy-probe"] }
tempfile = "3"
mod_platform = { package = "foundry-mod-api", path = "../foundry-mod-api", features = ["testing"] }
mod_api = { package = "foundry-mod-vocab", path = "../foundry-mod-vocab", features = ["testing"] }
# ui_theme's unit tests draw text in the design system's fonts.
foundry-theme = { path = "../foundry-theme" }
foundry-client-render = { path = "../foundry-client-render", features = ["test-support"] }
foundry-items = { path = "../foundry-items", features = ["test-support"] }
# Reads back the captures the server_perf tests write.
foundry-perf = { path = "../foundry-perf" }
# Every WGSL shader translated as wgpu's DirectX 12 backend does (gfx.rs tests).
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out", "msl-out", "spv-out"] }

