[package]
name = "foundry-items"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Blocks and items as the client knows them: block facts, item stacks and their data components, enchantments, cooldowns, bundles, and items in NBT"

[dependencies]
foundry-mod-package = { path = "../foundry-mod-package", default-features = false }
foundry-client-core = { path = "../foundry-client-core" }
foundry-core = { path = "../foundry-core" }
foundry-world = { path = "../foundry-world" }
serde = { version = "1", features = ["derive"] }
log = "0.4"
serde_json = { version = "1.0.151", features = ["raw_value"] }

[features]
# Test helpers (`Items::for_tests`, `enchant::tests`) for foundry-client's unit tests.
test-support = []

[lints]
workspace = true

[dev-dependencies]
# The enabled-mods test names a package side (`mod_api::Side`).
foundry-mod-vocab = { path = "../foundry-mod-vocab" }
