[package]
name = "foundry-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Foundry Client native development client"
autobins = false
autoexamples = false
autotests = false

[build-dependencies]
foundry-game-discovery = { path = "../foundry-game-discovery" }
foundry-mod-api-gen = { path = "../foundry-mod-api-gen" }
# The build script runs on the host, but embeds resources based on the target OS.
winresource = "0.1"

[dependencies]
foundry-guest-stack = { path = "../foundry-guest-stack" }
foundry-cosmetics = { path = "../foundry-cosmetics" }
foundry-hooks = { path = "../foundry-hooks" }
foundry-mod-runtime = { path = "../foundry-mod-runtime" }
mod_api = { package = "foundry-mod-vocab", path = "../foundry-mod-vocab" }
foundry-engine-slots = { path = "../foundry-engine-slots" }
foundry-mod-api-macros = { path = "../foundry-mod-api-macros" }
foundry-client-lib = { path = "../foundry-client-lib", default-features = false }
foundry-gameplay = { path = "../foundry-gameplay" }
foundry-client-gameplay = { path = "../foundry-client-gameplay" }
foundry-assets = { path = "../foundry-assets" }
foundry-client-core = { path = "../foundry-client-core" }
foundry-client-input = { path = "../foundry-client-input" }
foundry-client-render = { path = "../foundry-client-render" }
foundry-command = { path = "../foundry-command" }
foundry-items = { path = "../foundry-items" }
foundry-core = { path = "../foundry-core" }
# OptiFine-format pack files: custom entity models, random entity textures.
foundry-optifine = { path = "../foundry-optifine" }
# The server thread ahead of the workers (MinecraftServer.spin's Thread.setPriority).
foundry-threads = { path = "../foundry-threads" }
foundry-perf-format = { path = "../foundry-perf-format" }
foundry-world = { path = "../foundry-world" }
foundry-protocol = { path = "../foundry-protocol" }
# server.properties, eula.txt and the user lists, shared with foundry-server.
foundry-server-files = { path = "../foundry-server-files" }
# The JDK's clock, for the LAN host's random seed and the probes.
foundry-java-properties = { path = "../foundry-java-properties" }
# The dedicated server's anticheat, off unless server.toml's [anticheat] turns it on (docs/anticheat.md).
foundry-anticheat = { path = "../foundry-anticheat" }
# The dedicated server's chat filter: [chat_filter], the slur list, mutes (docs/chat-filter.md);
# `entry` installs it into the engine's hook (`foundry_server_files::chat_guard`).
foundry-chat-filter = { path = "../foundry-chat-filter" }
# Shader packs: reading them and turning their GLSL into naga modules.
foundry-shaders = { path = "../foundry-shaders" }
# Foundry Client's own shader packs: the format, the stages and the check (docs/shaders.md).
foundry-shader-api = { path = "../foundry-shader-api" }
# Play with Friends: invite codes and their tunnel; the `friends` feature.
foundry-friends = { path = "../foundry-friends", optional = true }
# The narrator (GameNarrator): text-to-speech of chat, system messages and screens.
foundry-narrator = { path = "../foundry-narrator" }
# Foundry Client mods: sandboxed WebAssembly components, off unless installed and turned on (docs/modding/src/how-to/content-mods.md).
# Their runtime is the `mods` feature.
foundry-mod-package = { path = "../foundry-mod-package", default-features = false, features = ["index", "runtime-process"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "naga-ir"] }
winit = "0.30.13"
pollster = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"
png = "0.18"
sha2 = "0.10.9"
# Server resource packs are checked and cached by their SHA-1, as vanilla does.
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# server.toml's [combat], which the dedicated server reads itself.
toml = "1.1"
# hlsl-out: the gfx.rs tests translate every shader as wgpu's DirectX 12 backend does. A normal feature,
# not a dev-dependency's, so builds, tests and examples share one build of naga, wgpu and this crate.
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out"] }
ab_glyph = "0.2.32"
log = "0.4"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
foundry-theme = { path = "../foundry-theme" }
# Machine and process probes for benchmark and dedicated-server performance reports.
foundry-system = { path = "../foundry-system" }
# Opt-in data collection: the game keeps, the launcher sends (docs/telemetry.md). The
# anonymous "I'm playing" ping is the Foundry Client layer's (`foundry-heartbeat`, in the official executable).
foundry-telemetry = { path = "../foundry-telemetry", default-features = false }
foundry-bench = { path = "../foundry-bench" }
crc32fast = "1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# Controllers (evdev + libudev on Linux, IOKit on macOS, Windows.Gaming.Input); the `controllers` feature.
gilrs = { version = "0.11", optional = true }
# The DualSense's rumble, adaptive triggers and lights, and an Xbox One pad's impulse triggers,
# over HID (gilrs only reads them).
foundry-dualsense = { path = "../foundry-dualsense", optional = true }
# HTTPS to the Minecraft services (online-mode session join).
ureq = { version = "2", default-features = false, features = ["tls"] }
# `LevelStorageAccess.estimateDiskSpace`: usable disk space, without unsafe code on Windows.
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
# Mod file roots are descriptor-bound: no symlink race can leave a mod's area.
cap-std = "3"
cap-fs-ext = "3"

[target.'cfg(unix)'.dependencies]
# The server thread's CPU time per tick (`FOUNDRY_SPIKES`, spans.rs).
rustix = { version = "1", default-features = false, features = ["std", "time", "process", "fs"] }

[target.'cfg(windows)'.dependencies]
# DirectX 12, where Vulkan has no adapter or device, or by choice (`graphicsApi`, graphics.rs).
# Shaders compile with FXC (d3dcompiler_47.dll, part of Windows), or on integrated GPUs with DXC
# (dxcompiler.dll beside the game, gfx/dx12_compiler.rs).
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Splitscreen: a window filling a monitor goes over its menu bar (game/runtime/split/windows.rs
# `above_menu_bar`); all already in the tree through winit and wgpu.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# OpenGL (WGL on Windows, EGL on Linux), the last fallback, for GPUs with no Vulkan or
# DirectX 12 driver (`graphicsApi`, graphics.rs).
wgpu = { version = "30.0.1", default-features = false, features = ["gles"] }

[features]
# Source retention only: not compiled/tested on the fork; incompatible with typed residency.
# Do not enable (including via --all-features); integration is tracked in arismoko/foundry#3491.
upstream-parallel-mobs = ["foundry-gameplay/upstream-parallel-mobs"]
default = ["audio", "controllers", "foundry-extras"]
# Scoped trait-mod installation for a mod's own tests.
testing = []
# Per-level-tick state digest for determinism checks (game/state_digest.rs).
state-digest = []
# Sound output. Without it (and `controllers`) the program links neither libasound nor libudev on
# Linux: the server build (`--no-default-features`, released as foundry-engine; docs/server.md).
audio = ["foundry-client-render/audio", "foundry-client-lib/audio"]
# Controllers: gilrs, and the DualSense's and Xbox One's own output. Without it only `foundry-ctl pad`'s
# virtual pad.
controllers = ["foundry-client-lib/controllers", "dep:gilrs", "dep:foundry-dualsense", "foundry-client-input/controllers"]
# Foundry Client's own extras over the vanilla game, for a fork that wants them out (docs/forking.md):
# cosmetics and emotes, the "Foundry Client player" presence, the official server added to
# the server list, the Foundry Client Settings and Mods pages and Play with Friends. Players always get
# them; there is no switch. `grep -rn foundry-extras crates/` lists
# every place it gates. Without it (`--no-default-features --features audio,controllers`) the
# client is best effort: CI builds only the default.
foundry-extras = ["friends"]
# Play with Friends: sharing a world behind an invite code (game/friends.rs). Joining one is
# foundry-friends' `game` side, which foundry-official registers (`foundry_hooks::tunnel`).
friends = ["dep:foundry-friends"]
# Records the call sites of mob random draws (`mob_ai_probe` traces).
rng-trace = ["foundry-core/rng-trace", "foundry-client-lib/rng-trace"]
# foundry-client-lib's own `default` (only `audio` and `controllers`, which `audio` and `controllers` above turn on
# anyway): what `-p foundry-client-lib` on the command line turns on. foundry-game's default asks for it, so the game
# built with and without `-p foundry-client-lib` (parity's two selections) is one build, not two.
client-lib-default = ["foundry-client-lib/default"]
# Rust's allocations go to the system heap instead of mimalloc, where heap profilers that replace
# malloc (heaptrack, valgrind's massif) see them. Also the Windows and macOS prebuilt archives' allocator
# (tools/prebuilt_game.py, arismoko/foundry#2394, arismoko/foundry#3877): there std's shared library keeps its own allocator. Otherwise mimalloc is faster.
system-allocator = ["foundry-threads/system-allocator"]
# mimalloc that counts each thread's allocations and frees (`stats` replies with `alloc`).
alloc-count = ["foundry-threads/alloc-count"]
# mimalloc with a tag on each block: `foundry-ctl memory` lists the live heap by startup step and
# thread (`heap_by_tag_mb`). For measuring only: each block costs 16 bytes more.
alloc-census = ["foundry-threads/alloc-census"]
# Compatibility with earlier experiment commands: main already uses mimalloc.
windows-mimalloc = []
# Opt-in Windows heap experiment; see docs/windows-allocators.md.
windows-segment-heap = []

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dev-dependencies]
foundry-client-core = { path = "../foundry-client-core", features = ["test-language-publication"] }
foundry-client-lib = { path = "../foundry-client-lib", default-features = false, features = ["test-payload-probe", "test-publication-scope", "test-residency-observer"] }
foundry-mod-wasm = { path = "../foundry-mod-wasm", features = ["runtime-fixture", "listener-fixture", "test-copy-probe"] }
wat = "1.261"
tempfile = "3"
foundry-mod-runtime = { path = "../foundry-mod-runtime", features = ["test-work-count"] }
foundry-threads = { path = "../foundry-threads", features = ["test-allocation-count"] }
mod_platform = { package = "foundry-mod-api", path = "../foundry-mod-api", features = ["testing"] }
mod_api = { package = "foundry-mod-vocab", path = "../foundry-mod-vocab", features = ["testing"] }
foundry-client-render = { path = "../foundry-client-render", features = ["test-support"] }
foundry-items = { path = "../foundry-items", features = ["test-support"] }
foundry-gameplay = { path = "../foundry-gameplay", features = ["test-support"] }
foundry-perf = { path = "../foundry-perf" }
# Every WGSL shader translated as wgpu's DirectX 12 backend does (gfx.rs tests).
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out", "msl-out", "spv-out"] }
