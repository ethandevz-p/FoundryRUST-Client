[package]
name = "foundry-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The game as the platform runs it: the engine's entry with the platform's parts registered, for an executable to start (docs/layers.md)"

[dependencies]
foundry-guest-stack = { path = "../foundry-guest-stack" }
foundry-client = { path = "../foundry-client", default-features = false }
foundry-mod-package = { path = "../foundry-mod-package", default-features = false, features = ["index"] }

foundry-mod-host = { path = "../foundry-mod-host", default-features = false }

[lints]
workspace = true

# The binary holds no tests (the library does): `cargo test` builds no empty test harness for it, which linked the
# whole crate again. It still builds for integration tests (CARGO_BIN_EXE_*) and clippy --all-targets.
[[bin]]
name = "foundry-client"
path = "src/main.rs"
test = false

[features]
# foundry-client/client-lib-default: one build of the game whether or not foundry-client-lib is also named.
default = ["audio", "controllers", "foundry-extras", "foundry-client/client-lib-default"]
audio = ["foundry-client/audio"]
controllers = ["foundry-client/controllers"]
foundry-extras = ["foundry-client/foundry-extras"]
testing = ["foundry-client/testing"]
friends = ["foundry-client/friends"]
rng-trace = ["foundry-client/rng-trace"]
system-allocator = ["foundry-client/system-allocator"]
alloc-census = ["foundry-client/alloc-census"]
alloc-count = ["foundry-client/alloc-count"]
windows-mimalloc = ["foundry-client/windows-mimalloc"]
windows-segment-heap = ["foundry-client/windows-segment-heap"]

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
foundry-protocol = { path = "../foundry-protocol" }
tempfile = "3"
foundry-core = { path = "../foundry-core" }
serde_json = "1"
