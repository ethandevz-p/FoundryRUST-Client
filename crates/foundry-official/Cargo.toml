[package]
name = "foundry-official"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The official game executable: the platform's game with Foundry Client's own in-game parts plugged in (docs/layers.md)"

# The binaries hold no tests (the library does): `cargo test` builds no empty test harness for them, each of which
# linked the whole crate again. They still build for integration tests (CARGO_BIN_EXE_*) and clippy --all-targets.
[[bin]]
name = "foundry-official"
path = "src/main.rs"
test = false

[dependencies]
foundry-addresses = { path = "../foundry-addresses" }
foundry-game = { path = "../foundry-game" }
foundry-platform = { path = "../foundry-platform" }
foundry-heartbeat = { path = "../foundry-heartbeat" }
foundry-friends = { path = "../foundry-friends", features = ["game"] }
foundry-official-servers = { path = "../foundry-official-servers" }
foundry-discord = { path = "../foundry-discord" }
foundry-perf-share = { path = "../foundry-perf-share" }
log = "0.4"

[build-dependencies]
# The build script runs on the host, but embeds resources based on the target OS.
winresource = "0.1"

[lints]
workspace = true
