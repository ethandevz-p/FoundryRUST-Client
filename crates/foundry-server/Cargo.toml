[package]
name = "foundry-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Host a Foundry Client server: server.toml, the CLI and the supervisor that runs the game headless (docs/server.md)"

[dependencies]
foundry-platform = { path = "../foundry-platform", features = ["server-files", "world", "mod-runtime-process", "protocol"] }
# Shared server configuration and launch command used by the native-mod launcher.
foundry-server-launch = { path = "../foundry-server-launch" }
# `foundry-server mcp`: the Model Context Protocol, shared with foundry-ctl and the launcher.
foundry-mcp = { path = "../foundry-mcp" }
# server.toml's [anticheat], which the game reads: checked here before every start.
foundry-anticheat = { path = "../foundry-anticheat" }
# server.toml's [chat_filter], which the game reads too: checked here before every start.
foundry-chat-filter = { path = "../foundry-chat-filter" }
# The log's local times, as the game prints them.
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
# The control API's token and the panel's login codes and sessions: the OS's random generator (already in the
# lockfile through the relay).
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# Updates: the release from GitHub, checked against the SHA-256 in its signed checksums (both already in the
# lockfile, ureq through foundry-server-files).
foundry-release-sign = { path = "../foundry-release-sign" }
sha2 = "0.10"
# Vanilla's management protocol: the WebSocket handshake's SHA-1 and Base64 (both already in the lockfile).
sha1 = "0.10"
base64 = "0.22"
# Its TLS (on by default, as vanilla's): rustls on ring, both already in the lockfile through ureq; the keystore
# is a PKCS12 file, as vanilla's, and one is generated (self-signed) when the owner sets none.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
p12-keystore = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
# [discord]: the chat drawn as a PNG with Pixelify Sans (SIL OFL, crates/foundry-theme/fonts).
ab_glyph = "0.2.32"
png = "0.18"
# Backups: one zip anyone can open, Windows included.
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
# SIGINT/SIGTERM/SIGHUP: stop the game cleanly when the terminal or the service manager asks.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
